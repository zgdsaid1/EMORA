name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://emora:emora_ci@localhost:5432/emora_test
      TEST_DATABASE_URL: postgresql://emora:emora_ci@localhost:5432/emora_test
      EMORA_RUN_DB_INTEGRATION: '1'
      AUTH_SECRET: emora-ci-only-secret-not-for-production-32
      BETTER_AUTH_URL: http://localhost:3000
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: emora
          POSTGRES_PASSWORD: emora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emora -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated test database
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1 -U emora -d postgres
          -c "CREATE DATABASE emora_test OWNER emora"
      - run: pnpm --filter @emora/database db:migrate:test
      - name: Verify database integration CI wiring
        run: pnpm --filter @emora/database exec vitest run src/integration-selectors.test.ts --reporter=verbose
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Run unit and database integration suites
        run: pnpm exec turbo run test -- --reporter=verbose
      - run: pnpm build

  product-reality-e2e:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://emora:emora_ci@localhost:5432/emora_test
      TEST_DATABASE_URL: postgresql://emora:emora_ci@localhost:5432/emora_test
      EMORA_RUN_DB_INTEGRATION: '1'
      AUTH_SECRET: emora-ci-only-secret-not-for-production-32
      BETTER_AUTH_URL: http://localhost:3000
      CI: 'true'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: emora_test
          POSTGRES_USER: emora
          POSTGRES_PASSWORD: emora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emora -d emora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @emora/database db:migrate:test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --add-reporter html --trace retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: product-reality-playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
